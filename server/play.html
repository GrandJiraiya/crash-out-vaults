<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault Wars - Server Alpha</title><style>body{background:#10131d;color:#eee;font:16px system-ui;margin:0}main{max-width:720px;margin:auto;padding:24px}h1,h2{color:#e6bd72}section{background:#1b2130;border:1px solid #394052;padding:16px;border-radius:12px;margin:12px 0}button{background:#302a24;color:#f9e2b0;border:1px solid #756545;border-radius:8px;padding:12px;margin:4px;font:inherit;cursor:pointer}button:disabled{opacity:.4}progress{width:100%;accent-color:#80e1b6}small{color:#a3adbe}</style></head><body><main><h1>VAULT WARS</h1><p>Alpha 0.5 · Local authoritative server demo · Fictional rewards only</p><section><h2>Adventurer</h2><p id="status" role="status">Connecting…</p><div id="hero"></div><div id="choices"></div></section><section><h2>Battlefield</h2><p id="battle"></p><div id="actions"></div></section><section><h2>Daily quests &amp; weekly vault</h2><p id="vault"></p><div id="quests"></div></section><section><h2>Armory</h2><div id="items"></div></section><small>Session stays in this browser. Local server files are not production accounts, and points cannot be exchanged for money.</small></main><script>
'use strict';
const $=id=>document.getElementById(id);let state=null,busy=false;
function button(where,label,action,value,disabled=false){const b=document.createElement('button');b.textContent=label;b.disabled=busy||disabled;b.onclick=()=>send(action,value);$(where).append(b)}
function render(){for(const id of ['choices','actions','quests','items'])$(id).replaceChildren();if(!state)return;const s=state,lv=1+Math.floor(s.xp/100),e=s.enemy;
$('hero').textContent=s.hero?s.hero+' · Level '+lv+' · '+s.xp+' XP · '+s.hp+' HP · Gear rank '+s.gear:'Choose a class';
if(!s.hero)for(const c of ['Paladin','Assassin','Warlock'])button('choices',c,'choose',c);
$('battle').textContent=e?e.name+' · '+e.hp+'/'+e.max+' HP · Recovery '+s.recoveries+'/2 · '+(s.turn%3===0?'Skill ready':'Skill cooldown '+(3-s.turn%3)):s.message;
if(s.hero){if(e){button('actions','Attack','attack');button('actions','Skill','skill',null,s.turn%3!==0);button('actions','Recover','heal',null,!s.recoveries)}else{button('actions','Sentinel Crypt','dungeon',1);button('actions','Ashen Depths (Lv 3)','dungeon',2,lv<3);button('actions','Void Citadel (Lv 5)','dungeon',3,lv<5);button('actions','Hollow King (Lv 2)','raid',null,lv<2||s.raidDone)}}
$('vault').textContent='Week '+s.week+' · '+s.points+'/100 contribution · '+(s.claimed?'Claimed':'Not claimed')+' · Dungeons '+s.daily.dungeons+'/3 · Skills '+s.daily.skills+'/5';
if(s.hero){button('quests','Claim dungeon quest','quest','dungeons',s.daily.dungeons<3||s.dailyClaimed.dungeons);button('quests','Claim skill quest','quest','skills',s.daily.skills<5||s.dailyClaimed.skills);button('quests','Claim demo vault','vault',null,s.points<100||s.claimed)}
const names={blade:'Sentinel Blade',shield:'Cryptguard Armor',crown:'Hollow King Relic',vault:'Vaultforged Weapon'};
for(const id of s.loot){const equipped=Object.values(s.equipped).includes(id);button('items',names[id]+(equipped?' (equipped)':''),'equip',id,!!e||equipped)}
if(!s.loot.length)$('items').textContent='No items yet.';
}
async function send(action,value){if(busy)return;busy=true;render();try{const res=await fetch('/api/game',action?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,value,revision:state.revision})}:{cache:'no-store'});const data=await res.json();if(!res.ok){if(res.status===409){const fresh=await fetch('/api/game',{cache:'no-store'});if(fresh.ok)state=(await fresh.json()).state}throw Error(data.error||'Request failed')}state=data.state;$('status').textContent=state.message}catch(e){$('status').textContent=e.message}finally{busy=false;render()}}
send();</script></body></html>
